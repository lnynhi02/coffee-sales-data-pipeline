[project]
name = "coffee-sales-data-pipeline"
version = "0.1.0"
description = "Coffee sales data pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "mysql-connector-python",
    "Faker",
    "redis",
    "kafka-python",
    "pyspark",
    "python-dotenv",
    "minio",
    "loguru",
    "confluent-kafka",
    "authlib",
    "cachetools",
    "attrs",
    "orjson",
    "jsonschema",
    "apache-flink"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true